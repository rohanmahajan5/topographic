<style>

  #rail{position:fixed;left:14px;right:14px;bottom:6px;height:18px;display:flex;align-items:center;gap:6px;z-index:4;pointer-events:none;

  #rail button.on{background:#2c3440;color:#fff;border-color:#2c3440}

  .sheet .hd span{font-size:10.5px;color:var(--muted);white-space:nowrap;flex:1;overflow:hidden;text-overflow:ellipsis}
  .sheet .hd .x{border:0;background:none;font-size:15px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}

    background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 10px 30px rgba(40,40,52,.16),0 1px 3px rgba(40,40,52,.08);overflow:hidden;font-size:12px;color:var(--ink)}

  .isheet .ses b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.isheet .ses i{font-style:normal;color:var(--muted);white-space:nowrap}
  .isheet .tl{display:flex;justify-content:space-between;padding:1px 0 1px 10px}.isheet .tl code{font:11px ui-monospace,Menlo,monospace;color:#3d4450}.isheet .tl span{color:var(--muted)}

<!-- the map engine (plan D12): small files beside the page, read through window.PG -->
<script src="engine/naive.js"></script><script src="engine/model.js"></script><script src="engine/legend.js"></script><script src="engine/surfaces.js"></script><script src="engine/keys.js"></script><script src="engine/forms.js"></script><script src="engine/row.js"></script><script src="engine/tree.js"></script><script src="engine/sheet.js"></script><script src="engine/testctl.js"></script><script src="engine/reply.js"></script><script src="engine/change.js"></script><script src="engine/syntax-colour.js"></script><script src="engine/outline.js"></script><script src="engine/fileview.js"></script>
<script>
(() => {
'use strict';

/* ================= settings (placement-real's camera: raised to 36 degrees, little yaw) ================= */
const qs = new URLSearchParams(location.search);
// the made-up floor (?stress=N, its generator further down: stressWorld)
// agents right (2026-11-22: files stay left aligned, agents are right aligned, oldest to the right):
// a folder's stacks stand in a row from its back edge's RIGHT end, seat 0 (the oldest; the archive on the root) rightmost, newer ones
// leftward toward the folder's name, the "+" one past the newest (the row's growing end, where the next arrival stands). ?agents=left
// gives back the earlier row (seat 0 just right of the name) for comparison.
const AGENTS_LEFT = qs.get('agents') === 'left';
const STRESS = { on: qs.has('stress'), n: qs.get('stress') === '0' ? 0 : Math.max(1, Math.min(120, +qs.get('stress') || 48)), replay: qs.get('replay') !== '0', t0: 0, W: null, seed: +qs.get('seed') || 7, mix: qs.get('mix') === 'busy' ? 'busy' : 'real' };
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
// speed (2nd pass): the same names and labels are measured every frame; a width is kept per font and text (only .width is read)
{ const mt0 = ctx.measureText.bind(ctx), MTW = new Map();
  let MTN = 0;          // speed (3rd pass): kept per font, then per text, so no joined key is built per call
  ctx.measureText = s => { let byF = MTW.get(ctx.font); if (byF === undefined) { byF = new Map(); MTW.set(ctx.font, byF); } let m = byF.get(s); if (m === undefined) { if (++MTN > 20000) { MTW.clear(); MTN = 1; byF = new Map(); MTW.set(ctx.font, byF); } m = { width: mt0(s).width }; byF.set(s, m); } return m; }; }
const EL = 36 * Math.PI / 180, SIN = Math.sin(EL), COS = Math.cos(EL);
const YAW = 5 * Math.PI / 180, CY = Math.cos(YAW), SY = Math.sin(YAW);
const TW = 104, TH = 80, IG = 22, LBL = 20, LANE = 10, PAD = 14, PLOT = 36, PGAP = 22, FRONT = 14;
const LEAN = 30 * Math.PI / 180, SL = Math.sin(LEAN), CL = Math.cos(LEAN);   // round-2's pages lean back to face the viewer
const PAGE_K = 0.55;                                                     // a page stands at a little over half its plot
// round-2's page sizes by what happened to the file, and the block colours by kind of call
const DIMS = { written: { pw: 32, ph: 34, nl: 18 }, read: { pw: 26, ph: 26, nl: 14 }, quiet: { pw: 18, ph: 17, nl: 8 } };
const FILL = { r: '#9aa0aa', w: '#1f8a78', x: '#6f7684', web: '#99a8cb', spawn: '#4b5566', m: '#d2c7ab', q: '#eba582', u: '#ece5d6', s: '#e2ded5' };      // s: what the first call already carried (live)      // u: a message to the agent (yours, its parent's, a child's handback)      // m: an agent message, q: a question to you (round 4)
// context scale (2026-11-09: one consistent spatial scale for context, with the sizes scaled down a bit; the shared scale
// from concepts/round-4/scale.html): column height is the agent's context on ONE tokens-to-height
// mapping for every column, so 150k is as tall on one column as on another whatever its compaction point. Linear to 250k, then
// logarithmic with the same slope at 250k, so a 1M box is not horribly tall. As a fraction of the staff (60% of the view at the
// fitted zoom): 100k 0.075, 250k 0.19, 367k 0.26, 500k 0.32, 1M 0.45 (the constants are the writer's judgement)
const TOK_KNEE = 250e3, TOK_SLOPE = 0.75 / 1e6;
const ICON_PX = 14, ICON_SIZE = 11, EXPAND_MS = 150, FIRST_PX = 6, BAND_PX = 3;
const KB = 9 / 6;                         // round-2's block sizes were in overview pixels (6 = a bar); here 6 of them make the base's 9-unit bar
const SOLID = 25, BEAM_MS = 500, FLASH_MS = 1200, HAND_MS = 400, SLIDE_MS = 2000, TRAIL_MS = 5000, IDLE_GLYPH_MS = 2000, READS_TO_MOVE = 3;
const IDLE = 300, BRK_KEEP = 20;                 // a pause of the whole run over five minutes folds to twenty seconds of height
const WIN_MIN = 600, WIN_MAX = 3600, RECENT = 0.9, TAU = 60;    // the latest hour (folded) is linear in the top 90%; older time is log in the rest
const STAFF_W = 90, STRIP_H = 30, BOTTOM = () => railH() + 6, PLH = 3, RIGHT = 230, RAIL_H = 18, RAIL_GAP = 6;      // the rail's band keeps the old strip's height
let COL_PX = 480;                                 // the staff's fixed height on screen: 60% of the viewport, set in fit()
const FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif', MONO = 'ui-monospace,SFMono-Regular,Menlo,monospace';
const C = {
  stall:'#c4861f', hb:'#23806f',
  plane:'#e7e3da', planeEdge:'#d3ccbf', block:'#eeeae2', blockEdge:'#d8d1c4', fold:'#e9e5dc',
  ink:'#2c3440', muted:'#85837d', faint:'#aaa59c', run:'#2f5597', done:'#9aa2b0', write:'#1f8a78', read:'#7d8591', ask:'#e0622a'
};

/* ================= helpers ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
const lerp = (a, b, u) => a + (b - a) * u;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(h1, h2, u) {
  const a = hexRgb(h1), b = hexRgb(h2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(u, 0, 1)).toString(16).padStart(2, '0')).join('');
}
function inPoly(pts, x, y) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const LOOKS = {};
function look(col) {
  return LOOKS[col] || (LOOKS[col] = { top: mix(col, '#ffffff', 0.32), front: col, side: mix(col, '#1d2430', 0.26), edge: rgba(mix(col, '#1d2430', 0.5), 0.75) });
}
const wrapCache = new Map();
function wrapText(str, px, maxW, maxLines, weight) {          // a-objects': at most maxLines, the last cut with "…"
  const k = str + '|' + px + '|' + maxW + '|' + maxLines + '|' + (weight || 400); if (wrapCache.has(k)) return wrapCache.get(k);
  ctx.font = `${weight || 400} ${px}px ${FONT}`;
  const words = String(str).split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const nx = cur ? cur + ' ' + w : w; if (cur && ctx.measureText(nx).width > maxW) { lines.push(cur); cur = w; } else cur = nx; }
  if (cur) lines.push(cur);
  let out = { lines: lines.length ? lines : [''], cut: false };
  if (lines.length > maxLines) {
    const ls = lines.slice(0, maxLines); let last = ls[maxLines - 1] + ' …';
    while (ctx.measureText(last).width > maxW && last.length > 3) last = last.slice(0, -3) + ' …';
    ls[maxLines - 1] = last; out = { lines: ls, cut: true };
  }
  if (wrapCache.size > 4000) wrapCache.clear();
  wrapCache.set(k, out); return out;
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function rrect(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }

/* ================= the file store: round 4's get / edit / set, with GET /api/file and POST /api/file behind them ================= */
// one entry per path: the text as the server last gave it, its version (the save check), what you typed and have not saved
// (null when nothing is pending) and the last error. Edits live in memory, as on round 4: a reload loses them.
const FILES = {
  files: {},
  reset() { this.files = {}; },
  entry(path) { return this.files[path] || (this.files[path] = { text: null, version: null, editedText: null, err: null, busy: false }); },
  get(path) { const e = this.files[path]; return e ? { text: e.text, editedText: e.editedText, err: e.err, busy: e.busy, mtime: e.mtime } : { text: null, editedText: null, err: null, busy: false, mtime: null }; },
  async load(path) {          // a fresh read, unless you are part-way through an edit (then the version you started from is kept for the save check)
    const e = this.entry(path), cwd = LIVE.cwd, g = gitLoc(path); if (e.editedText != null && e.text != null) return;          // git: a branch floor's page reads from its worktree
    e.busy = true; e.err = null;
    try { if (!g.cwd) throw new Error(g.branch + ' has no worktree: its pages are names from git ls-tree, nothing to read');
      const r = await api('file?cwd=' + enc(g.cwd) + '&path=' + enc(g.path)); if (cwd !== LIVE.cwd) return; e.text = r.text; e.version = r.version; e.mtime = r.mtime || null; }
    catch (x) { e.err = x.message; } finally { e.busy = false; }
  },
  edit(path, value) { const e = this.entry(path); e.editedText = value === (e.text == null ? '' : e.text) ? null : value; },
  async set(path, text) {    // save: POST with the version it was read at; the server refuses it if an agent changed the file meanwhile
    const e = this.entry(path); if (e.version == null) throw new Error('the file was never read; nothing to save over');
    e.busy = true;
    const g = gitLoc(path);          // git
    try { const r = await api('file', { cwd: g.cwd, path: g.path, text, version: e.version }); e.text = text; e.version = r.version; e.mtime = r.mtime || e.mtime; e.editedText = null; e.err = null; }
    catch (x) {
      if (/changed on disk/.test(x.message)) {           // keep your text; take the new version so a second save overwrites knowingly
        try { const r = await api('file?cwd=' + enc(g.cwd) + '&path=' + enc(g.path)); e.text = r.text; e.version = r.version; e.mtime = r.mtime || null; } catch (y) {}
        e.err = 'the file changed on disk since you opened it; save again to overwrite it';
      } else e.err = x.message;
      throw x;
    } finally { e.busy = false; }
  }
};

/* ================= the live source: the workspace server's canvas, sessions, histories, requests and event stream ================= */
const IDC = ['#4a6fa8', '#a0567a', '#6b8a3a', '#c4861f', '#5a5f8f', '#2f8b7a', '#7a5aa6'];
let M = null, open = new Set(), L = null;
let END = 1, GAPS = [], AG = [], DATAV = 0;
const LIVE = { token: null, cwd: '', connected: false, sessions: [], projects: [], requests: [], hist: new Map(), histAt: new Map(), items: new Map(),
  seenReq: new Map(), done: [], changed: new Set(), sig: '', D: null, origin: 0, at: 0, nowRel: 0, busy: false, err: '' };
const HOMES = (() => { try { return JSON.parse(localStorage.getItem('live-homes') || '{}'); } catch (e) { return {}; } })();
const saveHomes = () => { try { localStorage.setItem('live-homes', JSON.stringify(HOMES)); } catch (e) {} };
// the page's clock (epoch seconds). Drivers on a mock floor move it forward with window.__clock(seconds) (the inactive rule's
// steps: ten minutes after a read, 48 hours), so a test never waits out a real ten minutes; anywhere else it is the wall clock
let CLOCK = 0;
const wallNow = () => Date.now() / 1000 + CLOCK;
const liveNow = () => wallNow() - LIVE.origin;
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const baseName = p => p.split('/').pop();
const enc = encodeURIComponent;
const estTok = text => Math.max(1, Math.round(String(text || '').length / 4));        // a size the server or the stream has not reported yet
// a column's name: the session's title, cut short, unique on this floor (oldest keeps the plain name); cut past 40 characters
// (2026-11-07: names were cut too short, so the limit grew by at least 30%: was 30); on the floor a name prints its whole title where there is
// room (nameFit)
function names(sessions, max) {
  const used = new Map(), m = max || 40;
  return sessions.map(s => {
    let n = engPlain(s.label || 'agent') || 'agent'; if (n.length > m) n = n.slice(0, m - 2).replace(/\s+\S*$/, '') + '…';          // a title is quoted words too (engPlain)
    const k = used.get(n) || 0; used.set(n, k + 1); return k ? n + ' (' + (k + 1) + ')' : n;
  });
}
const canvasCalls = (D, sid) => D.events.filter(e => e.session === sid && e.path && (e.kind === 'read' || e.kind === 'write'))
  .map((e, i) => ({ t: e.t, k: e.kind === 'write' ? 'w' : 'r', d: dirOf(e.path), path: e.path, what: e.path, tok: e.tokens || 0, ln: e.lines || 0, lnK: e.lines != null, item: e.item || null, key: 'e' + i + ':' + e.t }));
